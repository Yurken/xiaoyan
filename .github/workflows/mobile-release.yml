name: Mobile Build (EAS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Build platform"
        required: true
        default: "android"
        type: choice
        options: [android]
      profile:
        description: "Build profile"
        required: true
        default: "preview"
        type: choice
        options: [development, preview, production]

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Check whether EXPO_TOKEN and EXPO_PROJECT_ID are configured
  check-token:
    name: Check EXPO_TOKEN
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          configured=true
          if [ -z "$TOKEN" ]; then
            configured=false
            echo "::warning::EXPO_TOKEN is not set — skipping EAS build"
          fi
          if [ -z "$PROJECT_ID" ]; then
            configured=false
            echo "::warning::EXPO_PROJECT_ID is not set — skipping EAS build"
          fi
          echo "configured=$configured" >> $GITHUB_OUTPUT

  build:
    name: EAS Build
    runs-on: ubuntu-latest
    needs: check-token
    if: needs.check-token.outputs.configured == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build (manual dispatch)
        working-directory: apps/mobile
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive
